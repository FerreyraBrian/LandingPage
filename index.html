<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizonte Espanhol - Escola de Idioma & Cultura</title>
    <meta name="description" content="Descubra a excelência no ensino de espanhol. Participe do nosso desafio de proficiência e dê o primeiro passo para a sua fluência. Matricule-se hoje mesmo!" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Formulários ocultos para o Netlify detectar no build -->
    <form name="registro-juego" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="tel" name="telefone" />
      <textarea name="motivo"></textarea>
    </form>
    
    <form name="consulta-directa" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <textarea name="consulta"></textarea>
    </form>
  </body>
</html>
